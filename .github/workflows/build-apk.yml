
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OverlayAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Verify Android project
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Android project files found."
          echo "Gradle version:"
          gradle --version

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: List APK output
        if: always()
        run: |
          find . -type f -name '*.apk' \
            -not -path './.git/*' -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
